services:
  - type: web
    name: 1chan-anon-forum
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_PATH
        value: /sch-admin-2026
      - key: ADMIN_PASSWORD
        sync: false
      - key: POST_RETENTION_DAYS
        value: 30
      - key: CLEANUP_SCHEDULE
        value: 0 3 1 * *
      - key: MAX_UPLOAD_MB
        value: 5
      - key: COVER_MAX_MB
        value: 2
      - key: POST_COOLDOWN_SECONDS
        value: 10
      # 远程 PostgreSQL：Supabase 或 Render PostgreSQL 连接串
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: true
      # 默认使用 Cloudinary；如果改用 Supabase Storage，
      # 把 STORAGE_DRIVER 改成 supabase，并填写下方 SUPABASE_* 变量。
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
