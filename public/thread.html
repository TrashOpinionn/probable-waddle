<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8b1f2f">
  <title>主题 · 校园匿名版</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header compact">
      <nav class="crumb">
        <a href="/">首页</a>
        <span class="crumb-sep">›</span>
        <a id="boardCrumb" href="#">分区</a>
      </nav>
      <h1 id="threadSubject" class="page-title">…</h1>
      <p id="threadMeta" class="site-desc"></p>
    </header>

    <main>
      <fieldset class="card form-card reply-card">
        <legend>回复本主题</legend>
        <form id="replyForm" enctype="multipart/form-data">
          <div class="field">
            <label for="content">内容</label>
            <textarea id="content" name="content" rows="4" maxlength="4000" placeholder="点回复上的「引用」可引用串号，也可以直接输入"></textarea>
          </div>
          <div class="field">
            <label for="image">图片 <span class="optional">可选</span></label>
            <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif,image/webp">
            <p id="imageHint" class="field-hint">支持 JPG / PNG / GIF / WEBP，且会校验真实文件内容</p>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">发表回复</button>
            <span id="formError" class="form-error"></span>
          </div>
        </form>
      </fieldset>

      <div id="opBox" class="post-list"></div>

      <section class="section">
        <div class="section-head">
          <h2>回复</h2>
          <span id="replyCountLabel" class="muted"></span>
        </div>
        <div id="replyList" class="reply-list">
          <p class="muted">正在加载…</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">点赞数高的回复会自动排在前面。</footer>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/thread.js"></script>
</body>
</html>
